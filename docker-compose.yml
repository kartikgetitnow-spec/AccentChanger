version: "3.8"

services:
  accent-changer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-clone-live
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WEBSOCKET_PORT=3000
      - AUDIO_SAMPLE_RATE=16000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
